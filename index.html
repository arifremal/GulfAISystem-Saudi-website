        l.as = 'image'
        l.href = '/assets/responsive/hero-slide-1-1280.webp'
        l.type = 'image/webp'
        l.setAttribute(

        l.setAttribute('imagesizes', '100vw')
        l.fetchPriority = 'high'

    <!-- Defer third-party chat until after first paint / idle -->
    <script>
      (function () {
        function loadChatWidget() {
          if (document.getElementById('gulf-ai-chat-widget')) return
          var s = document.createElement('script')
          s.id = 'gulf-ai-chat-widget'
          s.src = 'https://saudia.aiagentichub.io/widget.js'
          s.async = true
          document.body.appendChild(s)
        }
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadChatWidget, { timeout: 4000 })
        } else {
          window.addEventListener('load', function () {
            setTimeout(loadChatWidget, 1500)
          })
        }
      })()
    </script>
